<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<section>
    <div class="container-fluid p-5 mt-3">
        <!--        <div class="row">-->
        <!--            <div class="col-md-11">-->
        <div class="card card-sh">
            <div class="card-header text-center"><p class="fs-4">Cart Page</p>
                <th:block th:if="${session.success}">
                    <p class="text-success fw-bold">[[${session.success}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>
                <th:block th:if="${session.error}">
                    <p class="text-danger fw-bold">[[${session.error}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                </th:block>
            </div>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Image</th>
                    <th scope="col">Product Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Total Price</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c:${carts}">
                    <th scope="row">[[${c.id}]]</th>
                    <td><img th:src="@{'/img/'+${c.product.image}}" alt=""
                             width="70px" height="70px"></td>
                    <td>[[${c.product.title}]]</td>
                    <td>[[${c.product.discountPrice}]]</td>
                    <td>[[${c.quantity}]]</td>
                    <td>[[${c.totalPrice}]]</td>
                </tr>
                <tr>
                    <td></td>
                </tr>
                </tbody>
            </table>
        </div>
        <!--            </div>-->
        <!--        </div>-->
    </div>
</section>
</body>
</html>
