<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::Layout(~{::section})}">
<head>
    <title>Order</title>
</head>
<body>
<section>
    <div class="container mt-5 p-5">
        <div class="row">
            <div class="col-md-6">
                <form>
                    <p class="text-center fs-4">Fill Address</p>
                    <hr>
                    <div class="mb-3 row">
                        <div class="col p-1"><label>First Name<input type="text" name="firstname" placeholder="First Name" class="form-control col"></label></div>
                        <div class="col p-1"><label>Last Name<input type="text" name="lastname" placeholder="Last Name" class="form-control col ms-2"></label></div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1"><label>Email<input type="email" name="email" placeholder="Email" class="form-control col"></label></div>
                        <div class="col p-1"><label>Mobile Number<input type="text" name="mobile" placeholder="Mobile Number" class="form-control col"></label></div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1"><label>Address<input type="text" name="address" placeholder="Address" class="form-control col"></label></div>
                        <div class="col p-1"><label>City<input type="text" name="city" placeholder="City" class="form-control col"></label></div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1"><label>State<input type="text" name="state" placeholder="State" class="form-control col"></label></div>
                        <div class="col p-1"><label>Pincode<input type="number" name="pincode" placeholder="Pincode" class="form-control col"></label></div>
                    </div>
                </form>
            </div>
            <div class="col-md-6">
                <p class="text-center fs-4">Payment Type</p>
                <hr>
                <div class="card">
                    <div class="card-body">
                        <table  class="table table-borderless">
                            <tbody>
                            <tr>
                                <td>Total price</td>
                                <td>:</td>
                                <td>&#36; 10000</td>
                            </tr>
                            <tr>
                                <td>Delivery Fee</td>
                                <td>:</td>
                                <td>&#36; 200</td>
                            </tr>
                            <tr>
                                <td>Tax</td>
                                <td>:</td>
                                <td> &#36; 100</td>
                            </tr>
                            <tr class="border-top">
                                <td>Total</td>
                                <td>:</td>
                                <td> &#36; 10300</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card mt-2">
                    <div class="card-body">
                        <form action="/login" method="post">
                            <div class="mb-3"><label class="form-label">Select Payment Type
                                <select class="form-control">
                                    <option>--select--</option>
                                    <option>Cash On Delivery</option>
                                    <option>Online Payment</option>
                                </select>
                            </label>
                            </div>
                            <button type="submit" class="btn bg-black text-white col-md-12">Place Order</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
