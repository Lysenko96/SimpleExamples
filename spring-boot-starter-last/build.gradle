plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web:4.1.0")
    implementation("org.springframework.boot:spring-boot-starter:4.1.0")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:4.1.0")
    implementation("org.postgresql:postgresql:42.7.13")
    implementation("org.apache.tomcat.embed:tomcat-embed-jasper:11.0.24")
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test:4.1.0")
//    implementation("jakarta.annotation:jakarta.annotation-api:3.0.0")
//    implementation("org.springframework:spring-core:7.0.8")
//    implementation("org.springframework:spring-context:7.0.8")
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")
    testCompileOnly("org.projectlombok:lombok:1.18.46")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.46")
    testImplementation("org.springframework.boot:spring-boot-starter-test:4.1.0")
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}