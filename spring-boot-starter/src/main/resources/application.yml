test:
  msg: hello123
db:
  name: postgres123
  poolSize: 2
logging:
  level:
    root: WARN
    com.example.spring.repository: INFO
  file:
    name: com.example
    path: /

spring:
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://127.0.0.1:5432/springdata
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate:
      show_sql: true
      format_sql: true
