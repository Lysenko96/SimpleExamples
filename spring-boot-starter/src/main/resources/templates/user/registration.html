<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
<form th:action="@{/users}" method="post" th:object="${user}">
    <label for="username">Username:
        <input id="username" type="text" name="username" th:value="*{username}"> <!-- ${user.username}  -->
    </label><br>
    <label for="birthDate">BirthDate:
        <input id="birthDate" type="datetime-local" name="birthDate" th:value="${#temporals.format(user.birthDate, 'yyyy-MM-dd HH:mm:ss')}">
    </label><br>
    <label for="lastname">LastName:
        <input id="lastname" type="text" name="lastname" th:value="*{lastname}">
    </label><br>
    <label for="firstname">FirstName:
        <input id="firstname" type="text" name="firstname" th:value="*{firstname}">
    </label><br>
    <div th:each="role : ${roles}">
        <input th:id="${role}" type="radio" name="role" th:value="${role}" th:checked="${role == user.role}" />
        <label th:for="${role}" th:text="${role}">Role name</label>
    </div>
    <div>
        <label for="company">
            <select id="company" name="companyId">
                <option th:each="company : ${companies}"
                        th:value="${companyId}"
                        th:selected="${company.id() == user.companyId}"
                        th:text="${company.name()}">
                    Company
                </option>
            </select>
        </label>
    </div>
    <button type="submit">Register</button>
</form>
</body>
</html>
</body>
</html>
